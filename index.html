<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ファミコンウォーズライク</title>
  <meta name="theme-color" content="#1e293b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FCウォーズ" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <span id="turnLabel">ターン 1 - You</span>
      <select id="mapSelect"></select>
    </div>

    <div id="statsBar"></div>

    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="unitInfo" class="hidden"></div>
      <div id="turnBanner"></div>
    </div>

    <div id="actionBar" class="hidden">
      <button id="attackBtn">攻撃</button>
      <button id="captureBtn">占領</button>
      <button id="waitBtn">待機</button>
      <button id="cancelMoveBtn" class="secondary">キャンセル</button>
    </div>

    <div id="buildMenu" class="hidden">
      <div class="panelTitle">ユニット生産</div>
      <button id="buildSoldier">兵士</button>
      <button id="buildTank">戦車</button>
      <button id="cancelBuild">キャンセル</button>
    </div>

    <div id="bottomBar">
      <button id="saveBtn" class="secondary">Save</button>
      <button id="loadBtn" class="secondary">Load</button>
      <button id="endTurnBtn">ターン終了</button>
    </div>

    <div id="gameOverOverlay" class="hidden">
      <div id="gameOverText"></div>
      <button id="restartBtn">もう一度</button>
    </div>

    <div id="saveLoadOverlay" class="hidden">
      <div id="saveLoadTitle"></div>
      <div id="saveLoadSlots"></div>
      <button id="cancelSaveLoad" class="secondary">キャンセル</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
